[project]
name = "crosspost"
version = "0.1.0"
description = "Automated cross-platform content republishing tool"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2024.1.0",
    "feedparser>=6.0.0",
    "sqlmodel>=0.0.21",
    "apscheduler>=3.10.0",
    "pydantic-settings[yaml]>=2.0.0",
    "loguru>=0.7.0",
    "tenacity>=8.0.0",
    "faster-whisper>=1.2.1",
    "pysubs2>=1.8.0",
    "deepl>=1.28.0",
    "anthropic>=0.84.0",
    "opencc-python-reimplemented>=0.1.7",
    "srt>=3.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosspost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]
